<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Appointments</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #2c3e50, #3498db);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            width: 500px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            color: black;
            animation: fadeIn 0.8s ease-out;
        }

        h2 {
            text-align: center;
            color: #3498db;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #f1f1f1;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            transition: transform 0.3s ease;
        }

        li:hover {
            transform: scale(1.02);
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s ease;
        }

        .accept {
            background-color: #2ecc71;
            color: white;
        }

        .accept:hover {
            background-color: #27ae60;
        }

        .reject {
            background-color: #e74c3c;
            color: white;
        }

        .reject:hover {
            background-color: #c0392b;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Manage Appointments</h2>
        <ul id="appointmentList"></ul>
    </div>

    <script>
        // Fetch appointments from the API
        async function fetchAppointments() {
            try {
                const response = await fetch('http://localhost:3000/api/appointments');
                const appointments = await response.json();

                const list = document.getElementById('appointmentList');
                list.innerHTML = "";

                appointments.forEach(app => {
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <span><strong>${app.user_name}</strong> - ${new Date(app.date_time).toLocaleString()} - ${app.reason} - <strong>${app.status}</strong></span>
                        ${app.status === 'pending' ? `
                            <div class="buttons">
                                <button class="accept" onclick="updateStatus(${app.id}, 'accepted')">✔ Accept</button>
                                <button class="reject" onclick="updateStatus(${app.id}, 'rejected')">❌ Reject</button>
                            </div>` : ''
                        }
                    `;
                    list.appendChild(li);
                });
            } catch (error) {
                console.error("Error fetching appointments:", error);
            }
        }

        // Update appointment status (Accept/Reject)
        async function updateStatus(id, status) {
            try {
                const response = await fetch(`http://localhost:3000/api/appointments/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status })
                });

                if (response.ok) {
                    alert(`✅ Appointment ${status}!`);
                    fetchAppointments(); // Refresh the list
                } else {
                    alert("❌ Failed to update appointment");
                }
            } catch (error) {
                console.error("Error updating appointment:", error);
                alert("❌ Error updating appointment.");
            }
        }

        fetchAppointments(); // Load appointments on page load
    </script>

</body>

</html>
