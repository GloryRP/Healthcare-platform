<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book an Appointment</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #3498db, #2ecc71); /* Blue to Green Gradient */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: white;
        }

        .container {
            width: 400px;
            padding: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        h2 {
            color: #3498db;
        }

        label {
            display: block;
            margin: 10px 0 5px;
            color: #333;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #3498db;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        input:focus, textarea:focus {
            border-color: #2ecc71;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
            margin-top: 10px;
        }

        button:hover {
            background-color: #2ecc71;
        }

        /* Animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Book an Appointment</h2>
        <form id="appointmentForm">
            <label for="userName">Your Name:</label>
            <input type="text" id="userName" placeholder="Enter Your Name" required>

            <label for="dateTime">Date & Time:</label>
            <input type="datetime-local" id="dateTime" required>

            <label for="reason">Reason for Appointment:</label>
            <textarea id="reason" placeholder="Enter reason" rows="3"></textarea>

            <button type="submit">Book Appointment</button>
        </form>
    </div>

    <script>
        document.getElementById('appointmentForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const appointmentData = {
                user_name: document.getElementById('userName').value,
                hospital_id: 1, // Replace with actual hospital ID
                date_time: document.getElementById('dateTime').value,
                reason: document.getElementById('reason').value
            };

            try {
                const response = await fetch('http://localhost:3000/api/appointments', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(appointmentData)
                });

                if (response.ok) {
                    alert("✅ Appointment booked successfully!");
                    document.getElementById('appointmentForm').reset();
                } else {
                    alert("❌ Failed to book appointment");
                }
            } catch (error) {
                console.error(error);
                alert("❌ Error booking appointment.");
            }
        });
    </script>

</body>
</html>
